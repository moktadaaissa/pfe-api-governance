openapi: 3.0.0
info:
  title: Account Management API
  version: 1.0.0
  description: API for managing customer bank accounts, balances, and account status.

servers:
  - url: http://localhost:8000

tags:
  - name: Accounts
    description: Account lifecycle and retrieval operations
  - name: Admin
    description: Administrative account actions

paths:
  /accounts:
    get:
      summary: List accounts
      description: Retrieve a paginated list of customer accounts with optional filtering by status and currency.
      operationId: listAccounts
      tags:
        - Accounts
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [active, blocked, closed]
        - name: currency
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Accounts retrieved successfully
        "400":
          description: Invalid query parameters

    post:
      summary: Create account
      description: Create a new customer account.
      operationId: createAccount
      tags:
        - Accounts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAccountRequest"
      responses:
        "201":
          description: Account created successfully
        "400":
          description: Invalid request body
        "409":
          description: Duplicate account detected

  /accounts/{accountId}:
    get:
      summary: Get account by ID
      description: Retrieve detailed account information for a specific account identifier.
      operationId: getAccountById
      tags:
        - Accounts
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Account retrieved successfully
        "404":
          description: Account not found

    put:
      description: Update account settings such as alias, notification preferences, and display options.
      operationId: updateAccount
      tags:
        - Accounts
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAccountRequest"
      responses:
        "200":
          description: Account updated successfully
        "400":
          description: Invalid request body
        "404":
          description: Account not found

  /accounts/{accountId}/balance:
    get:
      summary: Get account balance
      description: ok
      operationId: getAccountBalance
      tags:
        - Accounts
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Account balance retrieved successfully

  /accounts/{accountId}/block:
    post:
      summary: Block account
      description: Block a customer account to prevent further transactions.
      operationId: blockAccount
      tags:
        - Admin
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Account blocked successfully
        "404":
          description: Account not found

  /accounts/{accountId}/close:
    post:
      summary: Close account
      description: Close a customer account permanently after validations are completed.
      operationId: closeAccount
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Account closed successfully
        "409":
          description: Account cannot be closed

  /account_reports:
    get:
      summary: Get reports
      description: Retrieve aggregated account reports for administrative monitoring.
      operationId: getAccountReports
      tags:
        - Admin
      responses:
        "200":
          description: Reports retrieved successfully
        "500":
          description: Internal server error

components:
  schemas:
    CreateAccountRequest:
      type: object
      required:
        - customerId
        - accountType
        - currency
      properties:
        customerId:
          type: string
        accountType:
          type: string
          enum: [checking, savings, business]
        currency:
          type: string
        alias:
          type: string

    UpdateAccountRequest:
      type: object
      properties:
        alias:
          type: string
        notificationEnabled:
          type: boolean
        displayName:
          type: string