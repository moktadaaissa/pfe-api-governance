openapi: 3.0.0
info:
  title: Users API
  version: 1.0.0
paths:
  /users:
    get:
      summary: Get users
      description: Retrieve all users from the system
      operationId: getUsers
      tags:
      - Users
      responses:
        '200':
          description: Successful response
        '400':
          description: Bad request
    post:
      summary: Create user
      description: Create a new user in the system
      operationId: createUser
      tags:
      - Users
      responses:
        '201':
          description: Created
        '400':
          description: Bad request
