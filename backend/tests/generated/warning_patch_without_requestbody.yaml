openapi: 3.0.0
info:
  title: Users API
  version: 1.0.0
paths:
  /users:
    get:
      summary: Get users
      description: Retrieve all users from the system
      operationId: getUsers
      tags:
      - Users
      responses:
        '200':
          description: Successful response
        '400':
          description: Bad request
    patch:
      summary: Patch user
      description: Patch an existing user in the system
      operationId: patchUser
      tags:
      - Users
      responses:
        '200':
          description: Patched
        '400':
          description: Bad request
