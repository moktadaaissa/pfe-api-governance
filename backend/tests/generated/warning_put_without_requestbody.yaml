openapi: 3.0.0
info:
  title: Users API
  version: 1.0.0
paths:
  /users:
    get:
      summary: Get users
      description: Retrieve all users from the system
      operationId: getUsers
      tags:
      - Users
      responses:
        '200':
          description: Successful response
        '400':
          description: Bad request
    put:
      summary: Update user
      description: Update an existing user in the system
      operationId: updateUser
      tags:
      - Users
      responses:
        '200':
          description: Updated
        '400':
          description: Bad request
